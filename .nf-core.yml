repository_type: pipeline

nf_core_version: 4.0.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-quantmsandes_logo_light.png
    - docs/images/nf-core-quantmsandes_logo_light.png
    - docs/images/nf-core-quantmsandes_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-quantmsandes_logo_light.png
    - docs/images/nf-core-quantmsandes_logo_light.png
    - docs/images/nf-core-quantmsandes_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: bigbio
  name: quantmsandes
  description: Exploratory quantms pipeline for DDA proteomics with the andes search
    engine
  author: Yasset Perez-Riverol
  version: 0.1.0dev
  force: true
  outdir: quantmsandes
  skip_features:
    - igenomes
    - fastqc
    - gitpod
  is_nfcore: false
